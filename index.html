    </div>
    <script>
        // iOS Safari: no pinch / double-tap zoom, no rubber-band, no long-press menu
        (function () {
            var o = { passive: false };
            var stop = function (e) { e.preventDefault(); };
            ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'selectstart', 'dragstart'].forEach(function (n) {
                document.addEventListener(n, stop, o);
            });
            document.addEventListener('touchmove', function (e) { if (e.touches.length > 1 || e.cancelable) e.preventDefault(); }, o);
            var last = 0;
            document.addEventListener('touchend', function (e) {
                var n = Date.now();
                if (n - last < 350 && e.cancelable) e.preventDefault();
                last = n;
            }, o);
        })();
    </script>
